name: PR Validate to QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'force-app/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate to QA
        env:
          QA_SFDX_URL: ${{ secrets.QA_SFDX_URL }}
        run: |
          echo "$QA_SFDX_URL" > qa-auth.txt
          sf org login sfdx-url --sfdx-url-file qa-auth.txt --alias qa
          rm qa-auth.txt

      - name: Validate deployment and run tests
        run: sf project deploy validate --source-dir force-app --target-org qa --test-level RunLocalTests
