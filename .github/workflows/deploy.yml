name: Deploy to QA then Prod

on:
  push:
    branches: [main]

jobs:
  deploy-qa:
    runs-on: ubuntu-24.04
    environment: qa
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate to QA
        env:
          QA_SFDX_URL: ${{ secrets.QA_SFDX_URL }}
        run: |
          echo "$QA_SFDX_URL" > qa-auth.txt
          sf org login sfdx-url --sfdx-url-file qa-auth.txt --alias qa
          rm qa-auth.txt

      - name: Deploy to QA
        run: sf project deploy start --source-dir force-app --target-org qa --test-level RunLocalTests

  deploy-prod:
    needs: deploy-qa
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate to Prod
        env:
          PROD_SFDX_URL: ${{ secrets.PROD_SFDX_URL }}
        run: |
          echo "$PROD_SFDX_URL" > prod-auth.txt
          sf org login sfdx-url --sfdx-url-file prod-auth.txt --alias prod
          rm prod-auth.txt

      - name: Deploy to Prod
        run: sf project deploy start --source-dir force-app --target-org prod --test-level RunLocalTests
